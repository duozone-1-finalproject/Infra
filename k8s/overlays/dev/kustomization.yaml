apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: infra

resources:
  - ../../base
  - ../../services/frontend
  - ../../services/backend
  - ../../services/ai
  - ../../services/nginx
  - ../../services/kafka
  - ../../services/elasticsearch

patchesStrategicMerge:
  - replica-patch.yaml

images:
  - name: backend-image
    newTag: dev-latest
  - name: ai-image
    newTag: dev-latest
  - name: kafka-image
    newTag: 3.5.0
