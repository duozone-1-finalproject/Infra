apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: hihi1260/frontend-image:1.0
          ports:
            - containerPort: 80
