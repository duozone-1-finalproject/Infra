apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai
  namespace: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai
  template:
    metadata:
      labels:
        app: ai
    spec:
      containers:
        - name: ai
          image: ai-image:latest
          ports:
            - containerPort: 8081
