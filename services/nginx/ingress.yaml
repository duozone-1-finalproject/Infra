# infra/services/nginx/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
name: infra-ingress
namespace: infra
annotations:
nginx.ingress.kubernetes.io/rewrite-target: /
spec:
rules:
  - host: backend.example.com
    http:
    paths:
      - path: /
        pathType: Prefix
        backend:
        service:
        name: backend-service
        port:
        number: 80
  - host: ai.example.com
    http:
    paths:
      - path: /
        pathType: Prefix
        backend:
        service:
        name: ai-service
        port:
        number: 81